<style>
  html, body {

    font-size: 52px;
    font-weight: 800;
    color: #ffffff;

  }
  .subtitle {
    margin-top: 8px;
    font-size: 23px;
    font-weight: 500;
    color: #9db4d9;
  }
  .shot {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translateX(-50%) rotate(-1.5deg);
    width: 780px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 50px 100px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .shot img { display: block; width: 100%; }
</style>
